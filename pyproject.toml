[project]
name = "kenya-data-engine"
version = "0.1.0"
description = "Local research engine that finds and ranks Kenyan data-journalism topics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pydantic-ai-slim[openai]>=2.54,<3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "feedparser>=6.0",
  "selectolax>=1.0",
  "trafilatura>=1.12",
  "pdfplumber>=0.11",
  "python-dateutil>=2.9",
  "PyYAML>=6.0",
  "cryptography>=42",
  "certifi>=2024.2.2",
  "textual>=1,<2",
  "openpyxl>=3.1",
  "pandas>=2.2",
]

[project.scripts]
engine = "kenya_data_engine.cli.app:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-python-dateutil",
  "reportlab>=5.0.1",
  "pandas-stubs>=3.0.5.260914",
  "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kenya_data_engine"]
include = ["src/kenya_data_engine/defaults/*.yaml", "src/kenya_data_engine/prompts/*.md", "src/kenya_data_engine/tui/*.tcss"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".superpowers", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# the score maths and failure counts deliberately use the multiplication sign
"src/kenya_data_engine/tui/*.py" = ["RUF001", "RUF012"]  # RUF012: Textual BINDINGS idiom
"tests/test_tui_*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["spikes/", ".superpowers/"]

[[tool.mypy.overrides]]
module = "kenya_data_engine.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".superpowers", "spikes"]
addopts = "--cov=kenya_data_engine --cov-fail-under=85"

