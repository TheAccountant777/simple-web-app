[project]
name = "kenya-data-engine"
version = "0.1.0"
description = "Local research engine that finds and ranks Kenyan data-journalism topics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pydantic-ai-slim[openai]>=0.0.50",
  "httpx>=0.27",
  "tenacity>=8.3",
  "feedparser>=6.0",
  "selectolax>=1.0",
  "trafilatura>=1.12",
  "pdfplumber>=0.11",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.9",
  "PyYAML>=6.0",
]

[project.scripts]
engine = "kenya_data_engine.cli.app:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-python-dateutil",
  "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kenya_data_engine"]
include = ["src/kenya_data_engine/defaults/*.yaml", "src/kenya_data_engine/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "Flask WebAPP", ".superpowers", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["Flask WebAPP/", "spikes/", ".superpowers/"]

[[tool.mypy.overrides]]
module = "kenya_data_engine.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["Flask WebAPP", ".superpowers", "spikes"]
addopts = "--cov=kenya_data_engine --cov-fail-under=85"

[tool.coverage.run]
omit = ["Flask WebAPP/*"]
