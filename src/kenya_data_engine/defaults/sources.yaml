# Radar sources: one self-contained entry per source, keyed by name.
#
# Fields
#   type:       rss | listing           (Google Trends is an rss source with kind: attention)
#   url:        feed or page URL
#   kind:       news | data_release | policy | attention
#   enabled:    true (default) | false
#   user_agent: optional per-source User-Agent override
#   notes:      free text for auditors (status, last verified date)
#   listing only: item, title, link, date   CSS selectors (date may be null).
#     Comma lists are intentional unions: any alternative may match (first in document order).
#
# Your <home>/sources.yaml is merged over this file by name, field by field: fix one selector,
# set `enabled: false`, or add a new source without copying the rest.
# Audit loop: `engine sources test <name>`, edit, repeat; then upstream fixes land here.
#
# Entries marked "agent-sourced" are unverified until `engine doctor` passes live.

