top_n: 5
concurrency: 4
cache_ttl_hours: 6.0

weights:
  data_ability: 0.35
  wallet_impact: 0.20
  timeliness: 0.20
  clarity_gap: 0.15
  novelty: 0.10

llm:
  base_url: https://api.deepseek.com
  pricing:
    input_per_m: 0.15
    output_per_m: 0.60
  stages:
    # deepseek-flash thinks by default, and thinking mode rejects the forced
    # tool_choice used for structured output, so structured stages disable it.
    synthesize_cluster:
      model: deepseek-flash
      max_tokens: 4096
      extra_body: {thinking: {type: disabled}}
    synthesize_score:
      model: deepseek-flash
      max_tokens: 4096
      extra_body: {thinking: {type: disabled}}

budgets:
  run_usd: 0.50

search:
  providers: [tavily, serper]

synth:
  max_signals: 300

radar:
  since_hours: 72
  lookahead_days: 21
  max_items: 10
  source_timeout_s: 20  # per source; sources themselves live in sources.yaml

trace:
  capture_llm: true  # write each LLM call to <run>/llm/*.json (redacted)
