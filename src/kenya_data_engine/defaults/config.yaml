top_n: 5
concurrency: 4
cache_ttl_hours: 6.0

weights:
  data_ability: 0.35
  wallet_impact: 0.20
  timeliness: 0.20
  clarity_gap: 0.15
  novelty: 0.10

llm:
  base_url: https://api.deepseek.com
  pricing:
    input_per_m: 0.15
    output_per_m: 0.60
    cache_hit_input_per_m: 0.015
  stages:
    # deepseek-flash thinks by default, and thinking mode rejects the forced
    # tool_choice used for structured output, so structured stages disable it.
    synthesize_cluster:
      model: deepseek-flash
      max_tokens: 4096
      extra_body: {thinking: {type: disabled}}
    synthesize_score:
      model: deepseek-flash
      max_tokens: 4096
      extra_body: {thinking: {type: disabled}}
    research_planner:
      model: deepseek-flash
      max_tokens: 4096
      extra_body: {thinking: {type: disabled}}
    research_scout:
      model: deepseek-flash
      max_tokens: 4096
      extra_body: {thinking: {type: disabled}}
    research_smoke:
      model: deepseek-flash
      max_tokens: 512
      extra_body: {thinking: {type: disabled}}

budgets:
  run_usd: 0.50

search:
  providers: [tavily, serper]

synth:
  max_signals: 300

radar:
  since_hours: 72
  lookahead_days: 21
  max_items: 10
  source_timeout_s: 20  # per source; sources themselves live in sources.yaml

trace:
  capture_llm: true  # write each LLM call to <run>/llm/*.json (redacted)

research:
  default_budget: standard
  presets:
    lean: {usd: 0.05, search_credits: 10, seconds: 120}
    standard: {usd: 0.15, search_credits: 25, seconds: 300}
    deep: {usd: 0.50, search_credits: 60, seconds: 900}
  shares: {planner: 0.15, scouts: 0.55, claims: 0.25, challenge: 0.05}
  search_shares: {planner: 0.25, scouts: 0.65, claims: 0.0, challenge: 0.10}
  protected: [claims, challenge]
  scout_concurrency: 3
  monthly_search_credits: 1000
  max_rounds: 3
  novelty_days: [14, 30]  # covered within 14 days caps novelty at 1; within 30 days at 3
  stale_days: {price: 45, rate: 45, statistic: 75, annual: 550, legal_status: 365, event: 365, forecast: 365, other: 365}
  tiers:  # domain suffix -> source tier; unknown domains are tier 4
    epra.go.ke: 1
    centralbank.go.ke: 1
    knbs.or.ke: 1
    treasury.go.ke: 1
    parliament.go.ke: 1
    kenyalaw.org: 1
    cma.or.ke: 1
    nse.co.ke: 1
    kra.go.ke: 1
    worldbank.org: 1
    imf.org: 1
    cob.go.ke: 2
    oagkenya.go.ke: 2
    go.ke: 2
    businessdailyafrica.com: 3
    nation.africa: 3
    standardmedia.co.ke: 3
    the-star.co.ke: 3
    capitalfm.co.ke: 3
    kbc.co.ke: 3
    reuters.com: 3
    bloomberg.com: 3
    africacheck.org: 3
    pesacheck.org: 3

data:
  max_bytes: {html: 5000000, pdf: 25000000, sheet: 10000000}
  max_redirects: 5
  pdf_max_pages: 60
  parse_timeout_s: 30
  per_domain_concurrency: 2
