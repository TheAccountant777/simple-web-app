top_n: 5
concurrency: 4
cache_ttl_hours: 6.0

weights:
  data_ability: 0.35
  wallet_impact: 0.20
  timeliness: 0.20
  clarity_gap: 0.15
  novelty: 0.10

llm:
  base_url: https://api.deepseek.com
  pricing:
    input_per_m: 0.15
    output_per_m: 0.60
  stages:
    # extra_body is empty until Spike 2 (needs an API key) says otherwise.
    synthesize_cluster:
      model: deepseek-flash
      max_tokens: 4096
      extra_body: {}
    synthesize_score:
      model: deepseek-flash
      max_tokens: 4096
      extra_body: {}

budgets:
  run_usd: 0.50

search:
  providers: [tavily, serper]

synth:
  max_signals: 300

radar:
  since_hours: 72
  lookahead_days: 21
  max_items: 10
  # unverified — confirm with engine doctor (Spike 3 not yet run)
  feeds:
    nation: https://nation.africa/kenya/rss.xml
    standard: https://www.standardmedia.co.ke/rss/headlines.php
    business_daily: https://www.businessdailyafrica.com/bd/rss.xml
    the_star: https://www.the-star.co.ke/rss
    kenyans: https://www.kenyans.co.ke/feeds/news
    capital_fm: https://www.capitalfm.co.ke/news/feed/
  # unverified — confirm with engine doctor
  trends_feed: https://trends.google.com/trending/rss?geo=KE
  # unverified — confirm with engine doctor (URLs and CSS selectors are best guesses)
  listings:
    cbk:
      url: https://www.centralbank.go.ke/press-releases/
      item: article
      title: h2 a
      link: h2 a
      date: time
      kind: policy
    knbs:
      url: https://www.knbs.or.ke/publications/
      item: article
      title: h2 a
      link: h2 a
      date: time
      kind: data_release
    epra:
      url: https://www.epra.go.ke/category/press-releases/
      item: article
      title: h2 a
      link: h2 a
      date: time
      kind: policy
    parliament:
      url: https://www.parliament.go.ke/the-national-assembly/house-business/bills
      item: table tbody tr
      title: td a
      link: td a
      date: td:nth-child(2)
      kind: policy
  enabled: [rss, trends, calendar, cbk, knbs, epra, parliament]
